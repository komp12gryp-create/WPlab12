<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #42a5f5;
            border-bottom: 2px solid red;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        nav a {
            margin-left: 15px;
            color: black;
            text-decoration: none;
        }

        main {
            flex: 1;
            padding: 15px;
        }

        form {
            width: 300px;
            margin: 0 auto;
            padding: 12px;
            border: 1px solid #aaa;
        }

        h2 {
            margin: -12px -12px 15px;
            padding: 10px;
            background: #42a5f5;
            color: white;
            text-align: center;
            font-size: 16px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
        }

        button {
            display: block;
            margin: 15px 0 0 auto;
            padding: 7px;
            cursor: pointer;
        }

        footer {
            background: #263238;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>Мій особистий блог</h1>
        <nav>
            <a href="#">Вхід</a>
            <a href="register.html">Реєстрація</a>
        </nav>
    </header>

    <main>
        <form>
            <h2>Реєстрація користувача</h2>
            <label for="surname">Прізвище</label>
            <input type="text" id="surname" name="surname" required>
            <label for="firstname">Ім'я</label>
            <input type="text" id="firstname" name="firstname" required>
            <label for="login">Логін</label>
            <input type="text" id="login" name="login" required>
            <button type="submit">Зареєструватись</button>
        </form>
    </main>

    <footer>
        © Всі права захищені.
    </footer>
</body>

</html>
